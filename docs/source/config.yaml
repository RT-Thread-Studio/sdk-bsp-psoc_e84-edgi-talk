# SDK 文档构建配置文件
project:
  name: "psoc_e84-edgi-talk SDK"
  title: "psoc_e84-edgi-talk"
  description: "Edgi-Talk 开发板基于 PSoC™ E84 MCU，为工程师提供了一个灵活、全面的开发平台。板上集成了丰富的外设接口和示例模块，助力开发者快速完成AI+多传感器、显示和通信应用的开发。"
  description_en: "The Edgi-Talk board is based on the PSoC™ E84 MCU and provides a flexible and comprehensive development platform.It integrates a variety of peripheral interfaces and sample modules, helping developers quickly implement AI+multi-sensor, display, and communication applications."
  version: "1.0.0"
  author: "PeterJhon"
  copyright: "Copyright (c) 2006-2025, RT-Thread Development Team"
  # language: "zh_CN" 
  website: "www.rt-thread.org"

# 仓库配置
repository:
  name: "sdk-bsp-psoc_e84-edgi-talk"
  projects_dir: "../../projects"
  docs_dir: "."

# 文档分类配置
categories:
  basic:
    name: "基础篇"
    name_en: "Basics"
    description: "基础功能"
    patterns:
      - "Edgi_Talk_M33_Template"
  driver:
    name: "驱动篇"
    name_en: "Drivers"
    description: "外设驱动"
    patterns:
      - "Edgi_Talk_M33_Driver_All"
      - "Edgi_Talk_M55_Driver_All"
      - "Edgi_Talk_M55_WIFI"
  component:
    name: "示例"
    name_en: "Example"
    description: "示例"
    patterns:
      - "Edgi_Talk_M55_LVGL"
      - "Edgi_Talk_M55_XiaoZhi"
  usb:
    name: "USB篇"
    name_en: "USB"
    description: "USB主机和设备驱动"
    patterns:
      - "Edgi_Talk_CherryUSB/Edgi_Talk_Extend_Screen"
      - "Edgi_Talk_CherryUSB/Edgi_Talk_M33_USB_RoleSwitch"
      - "Edgi_Talk_CherryUSB/Edgi_Talk_M55_USB_RoleSwitch"
      - "Edgi_Talk_CherryUSB/Edgi_Talk_M55_USB_UVC"
      - "Edgi_Talk_CherryUSB/Edgi_Talk_USB_Deepcraft"
  ipc:
    name: "IPC篇"
    name_en: "IPC"
    description: "IPC相关示例"
    patterns:
      - "Edgi_Talk_IPC/Edgi_Talk_M33_IPC"
      - "Edgi_Talk_IPC/Edgi_Talk_M55_IPC"
  ai:
    name: "AI篇"
    name_en: "AI"
    description: "AI相关示例"
    patterns:
      - "Edgi_Talk_M55_DEEPCRAFT_Deploy_Vision"
  faq:
    name: "常见问题"
    name_en: "FAQ"
    description: "常见问题解答"
    patterns:
      - "FAQ_page"
      - "FAQ_page/拓展外设配置指南"
# 文档生成配置
generation:
  copy_files:
    - "README.md"
    - "README_zh.md"
  copy_dirs:
    - "figures"
    - "resources"
  output_structure:
    - "start"
    - "basic"
    - "driver"
    - "component"
    - "usb"
    - "ipc"
    - "ai"
    - "faq"

# Sphinx 配置
sphinx:
  theme: "sphinx_rtd_theme"
  extensions:
    - "myst_parser"
  source_suffix:
    ".rst": "restructuredtext"
    ".md": "markdown"
  myst_extensions:
    - "colon_fence"
    - "deflist"
    - "dollarmath"
    - "html_image"
    - "html_admonition"
    - "replacements"
    - "smartquotes"
    - "strikethrough"
    - "substitution"
    - "tasklist" 
